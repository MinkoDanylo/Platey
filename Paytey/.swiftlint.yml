included:
  - Paytey

excluded:
  - DerivedData
  - .build

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - modifier_order
  - multiline_parameters
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - vertical_whitespace_closing_braces

analyzer_rules:
  - unused_import

disabled_rules:
  - todo

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y

force_unwrapping: error
